<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Hair by Beau</title>

    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: white;
            text-align: center;
            padding: 40px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .success-icon {
            font-size: 90px;
        }

        h1 {
            color: #d4af37;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
        }

        .status.success {
            color: #4caf50;
        }

        .status.error {
            color: #ff6b6b;
        }

        button {
            background: #d4af37;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Payment Successful!</h1>

        <div id="bookingDetails" class="booking-card" style="display:none;"></div>
        <div id="smsStatus">Loading booking...</div>

        <button onclick="window.location.href='/'">← Return Home</button>
    </div>

    <script>
        async function loadBookingDetails() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");

            const statusDiv = document.getElementById('smsStatus');
            const detailsDiv = document.getElementById('bookingDetails');

            if (!sessionId) {
                statusDiv.innerText = "No booking reference found.";
                statusDiv.className = "status error";
                return;
            }

            try {
                const res = await fetch(`/session/${sessionId}`);
                const data = await res.json();

                if (!data.booking) throw new Error();

                const b = data.booking;

                detailsDiv.innerHTML = `
                    <p><strong>Date:</strong> ${b.date}</p>
                    <p><strong>Time:</strong> ${b.time}</p>
                    <p><strong>Name:</strong> ${b.name}</p>
                    <p><strong>Phone:</strong> ${b.phone}</p>
                    <p><strong>Service:</strong> ${b.service}</p>
                `;
                detailsDiv.style.display = "block";

                statusDiv.innerText = "Booking confirmed & SMS sent!";
                statusDiv.className = "status success";

            } catch {
                statusDiv.innerText = "Payment successful. SMS will arrive shortly.";
                statusDiv.className = "status success";
            }
        }

        window.onload = loadBookingDetails;
    </script>
</body>

</html>

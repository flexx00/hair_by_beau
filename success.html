<!DOCTYPE html>
<html>
<head>
    <title>Booking Confirmed</title>
    <style>
        body { 
            background: #111; 
            color: white; 
            text-align: center; 
            padding: 100px 20px; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #d4af37; }
    </style>
</head>
<body>
    <h1>Payment Successful! 🎉</h1>
    <p>Your appointment is confirmed.<br>You will receive a confirmation text shortly.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bookingRaw = params.get("booking");

        if (bookingRaw) {
            try {
                const booking = JSON.parse(decodeURIComponent(bookingRaw));
                console.log("✅ Booking data loaded:", booking);

                fetch("http://localhost:3000/send-sms", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(booking)
                })
                .then(res => res.json())
                .then(data => {
                    console.log("SMS response:", data);
                    if (data.success) alert("Confirmation SMS sent ✅");
                })
                .catch(err => {
                    console.error("SMS request failed:", err);
                    alert("Payment successful, but SMS may have failed. Check console.");
                });
            } catch (e) {
                console.error("Failed to parse booking data");
                alert("Payment successful, but confirmation failed to process.");
            }
        } else {
            alert("No booking data found ❌");
        }
    </script>
</body>
</html>
